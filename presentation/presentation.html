## What do we mean by "reasoning"?

**Recall** — look something up:

<div style="background: #FEF8E6; border: 2px solid #000000; border-radius: 0px; padding: 16px; margin-top: 8px;">
"What's the course code for Stanford's Transformers class?" → CME 295
</div>

**Reasoning** — work it out:

<div style="background: #FEF8E6; border: 2px solid #000000; border-radius: 0px; padding: 16px; margin-top: 8px;">
"A bear was born in 2020. How old in 2025?" → 2025 − 2020 = <strong>5</strong>
</div>

Reasoning = solving a problem through a **multi-step process**, not a single lookup.

<img src="assets/cot_paper_fig1.png" style="max-height: 430px; max-width: 92%; display: block; margin: 0 auto;">

## Two reasons a reasoning chain helps

1. **Decomposition** — break a problem the model has never seen into sub-problems it *has*.
2. **More compute** — more tokens before the answer = more computation spent on it.

<div style="background: #FEF8E6; border: 2px solid #000000; border-radius: 0px; padding: 16px; margin-top: 40px;">
Extended chains and self-correction ("wait, that's wrong…") <strong>emerge from RL</strong>, not just from prompting.
</div>

## How to prompt a reasoning model — 1/3: universal principles

- Keep it **short, direct, goal-oriented** — these models reward clarity, not verbosity
- **Don't hand-write the reasoning** — say *"think thoroughly,"* not *"think step by step"*
- State **success criteria + hard constraints** up front (role → goal → constraints)
- Set depth with the **effort/thinking dial**, not with prompt padding
- **Zero-shot first**; add a few structured examples only if needed

<div style="background: #E8F1F9; border: 2px solid #000000; padding: 10px; margin-top: 12px; font-size: 14px;">
The reasoning is now the model's job. Your job is a crisp brief.
</div>

<p class="src">OpenAI reasoning best-practices · Anthropic extended-thinking tips · Gemini 3 guide.</p>

???
"Think step by step" is redundant (OpenAI) and inferior to "think thoroughly" (Anthropic) for internally-reasoning models.

## How do you train a model to *think*?

You don't write the reasoning for it. You **incentivize** it:

- Show a few examples of **thinking through** a problem (cold-start)
- Then **reward** the behavior you want with RL:
  - did it get the answer **right**? (accuracy)
  - did it use the **`<think>` markers**? (format)
  - did it **stay in one language**? (consistency)

<div style="background: #FEF8E6; border: 2px solid #000000; border-radius: 0px; padding: 16px; margin-top: 16px;">
No human writes the chains. The model discovers them.
</div>

---

## The trick: verifiable rewards

For math and code you can **check the answer automatically** — no learned reward model, no human rater in the loop.

- Math → compare to the parsed ground-truth number
- Code → run the **unit tests**

<div style="background: #FEF8E6; border: 2px solid #000000; border-radius: 0px; padding: 16px; margin-top: 16px;">
A cheap, unhackable signal is what makes pure-RL reasoning possible.
</div>

## Why no critic?

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 24px 0;">
<div style="background: #FBEAE7; padding: 16px; border: 2px solid #000000; border-radius: 0px;">
<h4 style="margin-top: 0; color: #000000;">PPO (classic RL)</h4>
<ul style="font-size: 14px; color: #2A2825;">
<li><strong>Baseline:</strong> learned value model (extra NN)</li>
<li><strong>Networks trained:</strong> policy + value</li>
<li><strong>Memory:</strong> ~2×</li>
<li><strong>Reward source:</strong> learned reward model (usually)</li>
</ul>
</div>
<div style="background: #EEF5EC; padding: 16px; border: 2px solid #000000; border-radius: 0px;">
<h4 style="margin-top: 0; color: #000000;">GRPO (DeepSeek)</h4>
<ul style="font-size: 14px; color: #2A2825;">
<li><strong>Baseline:</strong> mean reward of the group</li>
<li><strong>Networks trained:</strong> policy only</li>
<li><strong>Memory:</strong> ~1×</li>
<li><strong>Reward source:</strong> rule-based (correct? formatted?)</li>
</ul>
</div>
</div>

<p class="src">Half the moving parts. No reward hacking from a learned critic.</p>

# Working with Reasoning Models

*The practical API &amp; engineering half*

<p style="font-size: 15px; color: #5C5750; margin-top: 12px;">One fact drives every decision: the model spends hidden tokens thinking before it answers.</p>

???
Ten slides of the day-job: parameters, code, and engineering decisions across OpenAI, Anthropic & Google. Grounded in current official docs.

---

## 1 · The depth dial — one idea, three knobs

<table style="width:100%; font-size:13px; border:2px solid #000;">
<tr style="background:#000;color:#fff;"><th style="padding:6px;">OpenAI</th><th style="padding:6px;">Anthropic</th><th style="padding:6px;">Google</th></tr>
<tr><td style="padding:8px;border:1px solid #000;"><code>reasoning={"effort": ...}</code><br>none · low · medium · high · xhigh · max</td><td style="padding:8px;border:1px solid #000;"><code>thinking={"type":"adaptive"}</code><br>+ <code>output_config={"effort": ...}</code></td><td style="padding:8px;border:1px solid #000;"><code>thinking_level</code><br>minimal · low · medium · high</td></tr>
</table>

- Higher effort = more thinking tokens = better on hard tasks, slower + pricier; models scale **down** on easy inputs automatically
- Anthropic separates *whether* it thinks (`thinking`) from *how hard* (`effort`) — don't confuse them
- `budget_tokens` is **deprecated / 400** on newest Claude → use adaptive + effort
- `max_tokens` is the only **hard** ceiling; effort/budget are soft guidance

<p class="src">OpenAI reasoning guide · Anthropic thinking docs · Gemini thinking docs.</p>

---

## 2 · Streaming: visible vs summarized

- You **never get the raw chain of thought** — only an opt-in *summary*
- OpenAI `reasoning.summary` (auto/concise/detailed) · Anthropic `display` (summarized/omitted) · Gemini `thinking_summaries`
- Streaming order is always: **thinking deltas → signature → answer text**
- `display: "omitted"` cuts time-to-first-answer-token but **not** cost
- Summaries come from a *separate* model; the answering model never sees them

<div style="background:#E8F1F9;border:2px solid #000;padding:8px;margin-top:10px;font-family:'JetBrains Mono';font-size:13px;">
content_block_delta(thinking_delta…) → signature_delta → content_block_delta(text_delta…)
</div>

---

## 3 · Reasoning tokens are billed as output tokens

The single most important cost fact — **hidden thinking still costs money.**

- Read it: OpenAI `reasoning_tokens` · Anthropic `thinking_tokens` · Gemini `total_thought_tokens`
- You pay for the **full** thinking even when you only see a short summary
- Reserve headroom (OpenAI suggests **~25k**) or a truncated run bills you for thinking with **no answer**
- Budget = f(effort level, task complexity) — **measure, then tune down**

<div style="background: #FBEAE7; border: 2px solid #000000; padding: 10px; margin-top: 12px; font-size:14px;">
A response that hits <code>max_output_tokens</code> mid-thought comes back <code>incomplete</code> — and you're still charged.
</div>

---

## 4 · Multi-turn: carry the reasoning back

Reasoning state does **not** follow the conversation automatically.

- **Anthropic:** echo every `thinking` block back *unchanged* (incl. `redacted_thinking`) during tool use — edit/reorder/drop → **400**
- **OpenAI:** `previous_response_id` (stateful) *or* replay `encrypted_content` (stateless/ZDR); `reasoning.context` picks scope
- **Gemini:** resend `thought` signatures verbatim in stateless mode
- Chat Completions drops reasoning items → prefer the **Responses API** for agentic loops

<div style="background:#FEF8E6;border:2px solid #000;padding:8px;margin-top:10px;font-family:'JetBrains Mono';font-size:12px;">
second = responses.create(model="gpt-5.6", previous_response_id=first.id, input="Now patch it.")
</div>

---

## 5 · Tool use with reasoning

- A tool loop is **one assistant turn**: model reasons → calls tools → answers
- **Anthropic:** pick thinking mode per turn (can't toggle mid-turn); **forced tool choice needs *adaptive* thinking**
- **Interleaved thinking** = reason *between* tool calls (adaptive = automatic; manual = beta header)
- **OpenAI:** echo reasoning items + function-call items back every hop; mind the `phase` field
- Production pattern: **reasoning model plans, cheap model executes**

<div style="background:#EEF5EC;border:2px solid #000;padding:8px;margin-top:10px;font-size:13px;">
thinking → tool → <strong>thinking</strong> → tool → answer &nbsp;(interleaved beats one-shot for long agentic runs)
</div>

---

## 6 · Structured outputs / JSON

- OpenAI Structured Outputs (`json_schema`, `strict: true`) **works** with reasoning models
- Strict schema requires: all fields `required`, `additionalProperties: false`
- Biggest break = **truncation**: thinking eats the budget, JSON stops mid-object → give it headroom
- Anthropic path is **tool-use schemas** (Pydantic in this course); forced tool choice needs adaptive thinking
- Keep schemas **byte-stable** so they stay in the prompt cache

<div style="background:#FBEAE7;border:2px solid #000;padding:8px;margin-top:10px;font-size:13px;">
Guard every structured call against <code>incomplete</code> / parse failure.
</div>

---

## 7 · Prompt caching interactions

Caching is where reasoning config quietly wrecks your hit rate.

- Cache hits need **byte-identical prefixes**; OpenAI cached input ≈ **0.1×** cost
- **Anthropic renders thinking config/effort into the prompt** → changing it **breaks the cache**
- Lock **one** effort/budget per cached conversation; don't tune it mid-thread
- During tool loops, thinking blocks cache *with* tool results (then bill as input on read)
- Long reasoning runs outlive the 5-min cache → use the **1-hour TTL**

---

## 8 · Latency &amp; throughput

- To go faster: **drop effort first** — it shrinks thinking + answer together
- **Route by task:** reasoning model for hard/ambiguous, fast model for well-defined
- Stream, and use `display:"omitted"` to start the answer sooner (cost unchanged)
- Budgets > ~32k, or `max_tokens` > 21,333 → **stream and/or batch** to dodge timeouts
- Parallelize independent calls; spend high effort only where it pays

<p class="src">Latency ↔ effort is measurable — see the reproducibility notebook.</p>

---

## 9 · Common pitfalls (the 400 club)

<ul style="font-size:15px; line-height:1.7;">
<li><strong>Truncation</strong> is #1 — thinking exhausts the budget → incomplete output, still billed</li>
<li>Newest Claude **rejects custom `temperature`/`top_p`/`top_k`** and any response **prefill**</li>
<li>Never **edit, reorder, or drop** thinking blocks (incl. `redacted_thinking`) → 400</li>
<li>Don't say <em>"think step by step"</em> — over-prompting CoT hurts; be direct &amp; zero-shot</li>
<li>OpenAI: **developer** (not system) messages; Anthropic: migrate off `budget_tokens`</li>
</ul>
